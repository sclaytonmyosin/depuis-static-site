    // Function to handle menu item hover
function addHoverClass() {
  // Get all the menu items
  const menuItems = document.querySelectorAll('.menu-item');

  // Loop through each menu item
  menuItems.forEach(item => {
    // Add event listeners for hover
    item.addEventListener('mouseenter', () => {
      const menuItemClass = item.classList[0]; // Assuming the first class is in the format "menu-item_x"
      const menuItemName = menuItemClass.split('_')[1]; // Get the name part (e.g., about, gallery, etc.)

      // Add the class to #mainMenu
      document.querySelector('#mainMenu').classList.add(`menu-item_${menuItemName}`);
    });

    item.addEventListener('mouseleave', () => {
      const menuItemClass = item.classList[0]; // Assuming the first class is in the format "menu-item_x"
      const menuItemName = menuItemClass.split('_')[1]; // Get the name part (e.g., about, gallery, etc.)

      // Remove the class from #mainMenu
      document.querySelector('#mainMenu').classList.remove(`menu-item_${menuItemName}`);
    });
  });
}

// Call the function
addHoverClass();
